const T={fi:{welcome:'Tervetuloa Muuttobottiin.',sub:'Varaa, hyväksy hinta ja seuraa tilausta reaaliajassa.',client:'Asiakas',admin:'Admin',account:'Oma tili',code:'Varauskoodi',guest:'Jatka uutena asiakkaana',home:'Koti',calc:'Hintalaskuri',book:'Uusi varaus',track:'Seuranta',profile:'Profiili',logout:'Kirjaudu ulos',orders:'Omat tilaukset',available:'Aika näyttää vapaalta',busy:'Valittu aika ei ole vapaa',unknown:'Saatavuus vahvistetaan manuaalisesti'},en:{welcome:'Welcome to Muuttobotti.',sub:'Book, approve the price and follow your order live.',client:'Client',admin:'Admin',account:'My account',code:'Booking code',guest:'Continue as new customer',home:'Home',calc:'Price calculator',book:'New booking',track:'Tracking',profile:'Profile',logout:'Log out',orders:'My orders',available:'This time looks available',busy:'Selected time is not available',unknown:'Availability will be confirmed manually'},ru:{welcome:'Добро пожаловать в Muuttobotti.',sub:'Заказывайте, подтверждайте цену и следите за заказом онлайн.',client:'Клиент',admin:'Админ',account:'Мой аккаунт',code:'Код заказа',guest:'Продолжить как новый клиент',home:'Главная',calc:'Калькулятор',book:'Новый заказ',track:'Отслеживание',profile:'Профиль',logout:'Выйти',orders:'Мои заказы',available:'Это время выглядит свободным',busy:'Выбранное время занято',unknown:'Время будет подтверждено вручную'},uk:{welcome:'Ласкаво просимо до Muuttobotti.',sub:'Бронюйте, підтверджуйте ціну та стежте за замовленням наживо.',client:'Клієнт',admin:'Адмін',account:'Мій акаунт',code:'Код замовлення',guest:'Продовжити як новий клієнт',home:'Головна',calc:'Калькулятор',book:'Нове замовлення',track:'Відстеження',profile:'Профіль',logout:'Вийти',orders:'Мої замовлення',available:'Цей час виглядає вільним',busy:'Обраний час зайнятий',unknown:'Час буде підтверджено вручну'}};
const S={fi:{new:'Vastaanotettu',confirmed:'Vahvistettu',assigned:'Tekijä määritetty',on_the_way:'Matkalla',in_progress:'Käynnissä',completed:'Valmis',cancelled:'Peruttu',change_requested:'Muutos käsittelyssä'},en:{new:'Received',confirmed:'Confirmed',assigned:'Crew assigned',on_the_way:'On the way',in_progress:'In progress',completed:'Completed',cancelled:'Cancelled',change_requested:'Change requested'},ru:{new:'Получен',confirmed:'Подтверждён',assigned:'Исполнитель назначен',on_the_way:'В пути',in_progress:'В работе',completed:'Завершён',cancelled:'Отменён',change_requested:'Изменение рассматривается'},uk:{new:'Отримано',confirmed:'Підтверджено',assigned:'Виконавця призначено',on_the_way:'В дорозі',in_progress:'В роботі',completed:'Завершено',cancelled:'Скасовано',change_requested:'Зміна розглядається'}};
function tx(){return T[locale]||T.fi}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safe(v){try{return JSON.parse(v||'null')}catch{return null}}async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{Accept:'application/json',...(opt.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`HTTP ${r.status}`);return j}function stop(){if(timer){clearInterval(timer);timer=null}}function langs(){return `<div class="langs">${['fi','en','uk','ru'].map(x=>`<button data-lang="${x}" class="${x===locale?'on':''}">${x==='uk'?'UA':x.toUpperCase()}</button>`).join('')}</div>`}function bindLang(){document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{locale=b.dataset.lang;localStorage.mbLocale=locale;render()})}
function login(){stop();root.innerHTML=`<section class="login animate"><div class="between"><div class="brandrow"><div class="mark">M</div><div class="brand">Muuttobotti</div></div>${langs()}</div><div class="hero"><div class="kicker"><i class="dot"></i> V2.1 · LIVE OPERATIONS</div><h1>${esc(tx().welcome)}</h1><p class="lead">${esc(tx().sub)}</p></div><div class="glass"><div class="tabs"><button id="ct" class="${role==='client'?'on':''}">${esc(tx().client)}</button><button id="at" class="${role==='admin'?'on':''}">${esc(tx().admin)}</button></div><div id="clientLogin" class="${role==='client'?'':'hidden'}"><div class="seg"><button id="am" class="${mode==='account'?'on':''}">${esc(tx().account)}</button><button id="bm" class="${mode==='booking'?'on':''}">${esc(tx().code)}</button></div><div id="accountLogin" class="${mode==='account'?'':'hidden'}"><div class="field"><label>Email</label><input id="email" type="email" value="${esc(account?.email||'')}"></div><div id="codeField" class="field ${codeSent?'':'hidden'}"><label>6-digit code</label><input id="loginCode" inputmode="numeric" maxlength="6"></div><button id="accountGo" class="primary">${codeSent?'Verify & open':'Send login code'}</button></div><div id="bookingLogin" class="${mode==='booking'?'':'hidden'}"><div class="field"><label>Booking ID</label><input id="bid" value="${esc(saved?.id||'')}" placeholder="MB-12AB34CD"></div><div class="field"><label>Access key</label><input id="bkey" type="password" value="${esc(saved?.key||'')}"></div><button id="bookingGo" class="primary">Open booking</button></div><button id="guest" class="secondary">${esc(tx().guest)}</button><div id="loginMsg" class="msg"></div></div><div id="adminLogin" class="${role==='admin'?'':'hidden'}"><p class="small">Muuttobotti staff · Operations Console</p><div class="field"><label>Admin token</label><input id="adminToken" type="password" value="${esc(adminToken)}"></div><button id="adminGo" class="primary">Open Operations</button><div id="adminMsg" class="msg"></div></div></div><div class="downloads"><div class="between"><b>Android · v2.1</b><span class="kicker">BUILD</span></div><p class="small">Standalone APK is published from the verified GitHub Actions build.</p><a href="https://github.com/Gek2or/muuttobotti-finland/actions" target="_blank" rel="noreferrer">Android builds →</a></div></section>`;bindLang();document.getElementById('ct').onclick=()=>{role='client';login()};document.getElementById('at').onclick=()=>{role='admin';login()};document.getElementById('am')?.addEventListener('click',()=>{mode='account';login()});document.getElementById('bm')?.addEventListener('click',()=>{mode='booking';login()});document.getElementById('guest')?.addEventListener('click',()=>{account=null;booking=null;client('home')});document.getElementById('accountGo')?.addEventListener('click',accountAuth);document.getElementById('bookingGo')?.addEventListener('click',bookingAuth);document.getElementById('adminGo')?.addEventListener('click',adminAuth)}
async function accountAuth(){const m=document.getElementById('loginMsg');m.textContent='';try{const email=document.getElementById('email').value.trim().toLowerCase();if(!codeSent){await api('/api/client/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'request_code',email})});codeSent=true;login()}else{const r=await api('/api/client/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify_code',email,code:document.getElementById('loginCode').value.trim()})});account={token:r.token,email,profile:r.profile,bookings:r.bookings||[]};localStorage.mbAccount=JSON.stringify(account);client('home')}}catch(e){m.textContent=e.message}}
async function bookingAuth(){const m=document.getElementById('loginMsg');m.textContent='';try{const id=document.getElementById('bid').value.trim().toUpperCase(),key=document.getElementById('bkey').value.trim().toLowerCase();const r=await api('/api/bookings/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,key})});saved={id,key};booking=r.booking;events=r.events||[];localStorage.mbBooking=JSON.stringify(saved);client('track')}catch(e){m.textContent=e.message}}
async function adminAuth(){const m=document.getElementById('adminMsg');m.textContent='';try{adminToken=document.getElementById('adminToken').value.trim();localStorage.mbAdmin=adminToken;await loadAdmin();admin()}catch(e){m.textContent=e.message}}
function shell(title,body){root.innerHTML=`<section class="shell animate"><header class="header"><div class="headrow"><div class="brandrow"><div class="mark" style="width:34px;height:34px;border-radius:11px;font-size:15px">M</div><b>Muuttobotti</b></div><button id="logout" class="headbtn">${esc(tx().logout)}</button></div><h2>${esc(title)}</h2><p>Live Operations · v2.1</p></header><div class="content" id="content">${body}</div><nav class="nav">${[['home','⌂'],['calc','€'],['book','＋'],['track','◎'],['profile','≡']].map(([x,i])=>`<button data-v="${x}" class="${view===x?'on':''}"><b>${i}</b>${esc(tx()[x])}</button>`).join('')}</nav></section>`;document.getElementById('logout').onclick=clientLogout;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>client(b.dataset.v))}
async function clientLogout(){stop();if(account?.token)api('/api/client/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout',token:account.token})}).catch(()=>{});localStorage.removeItem('mbAccount');localStorage.removeItem('mbBooking');account=null;saved=null;booking=null;events=[];login()}
async function refreshAccount(){if(!account?.token)return;try{const r=await api('/api/client/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'me',token:account.token})});account={...account,profile:r.profile,bookings:r.bookings||[]};localStorage.mbAccount=JSON.stringify(account)}catch(e){if(/SESSION_INVALID|401/i.test(e.message)){clientLogout()}}}
async function client(v){stop();view=v||view;if(view==='home'){await refreshAccount();home()}else if(view==='calc')calcPage();else if(view==='book')bookPage();else if(view==='track')trackPage();else if(view==='profile'){await refreshAccount();profilePage()}}
function home(){const orders=account?.bookings||[];const active=booking||orders.find(x=>!['completed','cancelled'].includes(x.status));shell(tx().home,`${active?`<button id="active" class="panel darkp" style="width:100%;text-align:left"><span class="status">● ${esc(S[locale]?.[active.status]||active.status)}</span><h3>${esc(active.id)}</h3><div class="route">${esc(active.pickup)} → ${esc(active.destination)}</div><p class="small">${esc(active.preferred_date)} · ${esc(active.preferred_time)}</p></button>`:''}<div class="grid" style="margin-top:9px"><button class="card accent" data-go="calc"><div class="ico">€</div><b>${esc(tx().calc)}</b><span>Moving · cleaning · transport</span></button><button class="card" data-go="book"><div class="ico">＋</div><b>${esc(tx().book)}</b><span>Smart availability & photos</span></button><button class="card" data-go="track"><div class="ico">◎</div><b>${esc(tx().track)}</b><span>Status · price · crew · timeline</span></button><button class="card" data-go="profile"><div class="ico">≡</div><b>${esc(tx().profile)}</b><span>${orders.length} ${esc(tx().orders.toLowerCase())}</span></button></div>`);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>client(b.dataset.go));if(document.getElementById('active'))document.getElementById('active').onclick=async()=>{if(!booking&&active&&account?.token){const r=await api('/api/client/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'me',token:account.token,bookingId:active.id})});booking=r.booking;events=r.events||[]}client('track')}}
function calcPage(){const c=safe(localStorage.mbCalc)||{service:'moving',movers:2,size:45,distance:15};const result=calcValue(c);shell(tx().calc,`<div class="seg"><button data-s="moving" class="${c.service==='moving'?'on':''}">Moving</button><button data-s="cleaning" class="${c.service==='cleaning'?'on':''}">Cleaning</button><button data-s="transport" class="${c.service==='transport'?'on':''}">Transport</button></div><div class="field"><label>${c.service==='cleaning'?'Area m²':'Distance km'}</label><input id="mainValue" type="number" value="${c.service==='cleaning'?(c.size||45):(c.distance||15)}"></div>${c.service==='moving'?`<div class="field"><label>Home size m²</label><input id="size" type="number" value="${c.size||45}"></div><div class="chips"><button data-m="1" class="chip ${c.movers===1?'on':''}">1 · 59 €/h</button><button data-m="2" class="chip ${c.movers===2?'on':''}">2 + Crafter · 75 €/h</button></div>`:''}<div class="panel darkp"><span class="kicker">PRELIMINARY</span><div class="price">${result.price} €</div><div>${result.hours.toFixed(1)}–${(result.hours+.5).toFixed(1)} h</div><button id="useEstimate" class="primary">${esc(tx().book)} →</button></div>`);document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{c.service=b.dataset.s;localStorage.mbCalc=JSON.stringify(c);calcPage()});document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{c.movers=Number(b.dataset.m);localStorage.mbCalc=JSON.stringify(c);calcPage()});['mainValue','size'].forEach(id=>document.getElementById(id)?.addEventListener('change',e=>{if(id==='size')c.size=Number(e.target.value);else if(c.service==='cleaning')c.size=Number(e.target.value);else c.distance=Number(e.target.value);localStorage.mbCalc=JSON.stringify(c);calcPage()}));document.getElementById('useEstimate').onclick=()=>{estimate={service:c.service,snapshot:{...c,quotedPrice:result.price,quotedDuration:`${result.hours.toFixed(1)} h`}};localStorage.mbEstimate=JSON.stringify(estimate);client('book')}}
function calcValue(c){if(c.service==='cleaning'){const h=Math.max(2,(c.size||45)/24);return{hours:h,price:Math.round(h*32.9)}}if(c.service==='transport'){const h=Math.max(1,1+Math.max(0,(c.distance||15)-10)/50);return{hours:h,price:Math.round(Math.max(79,h*49+Math.max(0,(c.distance||15)-10)*.85))}}const h=Math.max(2,1.7+(c.size||45)/50+Math.max(0,(c.distance||15)-10)/50);return{hours:h,price:Math.round(h*(c.movers===1?59:75)+Math.max(0,(c.distance||15)-10)*.85)}}
let av=null;async function bookPage(){const d=new Date(Date.now()+86400000).toISOString().slice(0,10),pref=account?.profile||{};shell(tx().book,`${estimate?`<div class="panel darkp"><span class="kicker">ESTIMATE ATTACHED</span><h3>${esc(estimate.service)} · ${esc(estimate.snapshot?.quotedPrice||'')} €</h3></div>`:''}<form id="bf"><div class="field"><label>Service</label><select name="service"><option value="moving">Moving</option><option value="cleaning">Cleaning</option><option value="transport">Transport</option></select></div><div class="field"><label>Name</label><input required name="name" value="${esc(pref.displayName||'')}"></div><div class="twocol"><div class="field"><label>Phone</label><input required name="phone" value="${esc(pref.phone||'')}"></div><div class="field"><label>Email</label><input required type="email" name="email" value="${esc(account?.email||'')}"></div></div><div class="field"><label>Pickup / service address</label><input required name="pickup"></div><div class="field"><label>Destination</label><input name="destination"></div><div class="twocol"><div class="field"><label>Date</label><input required type="date" name="date" value="${d}"></div><div class="field"><label>Time</label><input required type="time" name="time" value="10:00"></div></div><div id="av"></div><div class="chips" id="slots"></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><div class="field"><label>Photos · max 5</label><input name="photos" type="file" accept="image/*" multiple></div><button class="primary">Send booking</button><div id="bm" class="msg"></div></form>`);const f=document.getElementById('bf');f.date.onchange=checkAv;f.time.onchange=renderAv;f.onsubmit=sendBooking;await checkAv()}
async function checkAv(){const f=document.getElementById('bf');if(!f)return;try{av=await api(`/api/availability?from=${encodeURIComponent(f.date.value)}&to=${encodeURIComponent(f.date.value)}`)}catch{av=null}renderAv()}
function blocked(date,time){if(!av?.db)return false;if((av.fullDays||[]).includes(date))return true;if((av.bookedStarts||[]).some(x=>x.date===date&&x.time.slice(0,5)===time))return true;return(av.blocks||[]).some(x=>x.date===date&&time>=x.start.slice(0,5)&&time<x.end.slice(0,5))}
function renderAv(){const f=document.getElementById('bf');if(!f)return;const bad=blocked(f.date.value,f.time.value),state=av?.db?(bad?'bad':'ok'):'',text=av?.db?(bad?tx().busy:tx().available):tx().unknown;document.getElementById('av').innerHTML=`<div class="availability ${state}"><i></i><div><b>${esc(text)}</b><div class="small">${esc(f.date.value)} · ${esc(f.time.value)}</div></div></div>`;document.getElementById('slots').innerHTML=['09:00','10:00','12:00','14:00','16:00'].map(x=>`<button type="button" class="chip ${x===f.time.value?'on':''}" data-time="${x}" ${av?.db&&blocked(f.date.value,x)?'disabled':''}>${x}</button>`).join('');document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{f.time.value=b.dataset.time;renderAv()})}
async function sendBooking(e){e.preventDefault();const f=e.target,m=document.getElementById('bm');m.textContent='';if(av?.db&&blocked(f.date.value,f.time.value)){m.textContent=tx().busy;return}try{const fd=new FormData(f);fd.set('destination',fd.get('destination')||fd.get('pickup'));fd.set('client_locale',locale);fd.set('client_timezone',Intl.DateTimeFormat().resolvedOptions().timeZone||'Europe/Helsinki');fd.set('page_url',location.href);if(estimate)fd.set('calculator_snapshot',JSON.stringify(estimate.snapshot));const files=f.photos.files;if(files.length>5)throw new Error('Maximum 5 photos');const r=await api('/api/bookings',{method:'POST',body:fd});if(r.fallback==='whatsapp'){location.href=r.whatsappUrl;return}saved={id:r.bookingId,key:r.accessKey};localStorage.mbBooking=JSON.stringify(saved);localStorage.removeItem('mbEstimate');estimate=null;m.className='msg ok';m.innerHTML=`✓ ${esc(r.bookingId)}<br>${esc(r.accessKey)}`;setTimeout(()=>client('track'),500)}catch(err){m.textContent=err.message}}
async function loadTrack(){try{if(saved){const r=await api('/api/bookings/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(saved)});booking=r.booking;events=r.events||[];return}if(account?.token&&booking?.id){const r=await api('/api/client/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'me',token:account.token,bookingId:booking.id})});booking=r.booking;events=r.events||[]}}catch(e){console.warn(e)}}
async function trackPage(){await loadTrack();if(!booking){shell(tx().track,`<div class="field"><label>Booking ID</label><input id="tid"></div><div class="field"><label>Access key</label><input id="tkey" type="password"></div><button id="to" class="primary">Open</button><div id="tm" class="msg"></div>`);document.getElementById('to').onclick=async()=>{try{const id=document.getElementById('tid').value.trim().toUpperCase(),key=document.getElementById('tkey').value.trim().toLowerCase();const r=await api('/api/bookings/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,key})});saved={id,key};localStorage.mbBooking=JSON.stringify(saved);booking=r.booking;events=r.events||[];trackPage()}catch(e){document.getElementById('tm').textContent=e.message}};return}renderTrack();timer=setInterval(async()=>{if(view==='track'){await loadTrack();renderTrack()}},20000)}
function renderTrack(){shell(tx().track,`<div class="panel darkp"><div class="kicker"><i class="dot"></i> LIVE · ${esc(booking.id)}</div><h2>${esc(S[locale]?.[booking.status]||booking.status)}</h2><div class="route">${esc(booking.pickup)} → ${esc(booking.destination)}</div><p class="small">${esc(booking.preferred_date)} · ${esc(booking.preferred_time)}</p></div>${booking.quote_status==='pending'&&Number(booking.quoted_price)>0?`<div class="panel"><span class="kicker" style="color:#54713a">PRICE OFFER</span><div class="price">${Number(booking.quoted_price).toFixed(2)} €</div><p class="small">${esc(booking.admin_note||'')}</p><button id="accept" class="primary">Accept price</button></div>`:''}${booking.assigned_worker?`<div class="panel darkp"><span class="kicker">CREW</span><h3>${esc(booking.assigned_worker)}</h3><p>${esc(booking.assigned_worker_phone||'')}</p></div>`:''}<div class="panel"><b>Timeline</b><div class="timeline">${events.slice().reverse().map(e=>`<div class="event"><b>${esc(S[locale]?.[e.status]||e.event_type)}</b><div class="small">${esc(new Date(e.created_at).toLocaleString())} · ${esc(e.source)}</div>${e.note?`<div class="small">${esc(e.note)}</div>`:''}</div>`).join('')||'<p class="small">No events yet</p>'}</div></div><button id="refresh" class="dark">↻ Refresh</button>`);if(document.getElementById('accept'))document.getElementById('accept').onclick=()=>bookingAction('accept_quote');document.getElementById('refresh').onclick=trackPage}
async function bookingAction(action,patch={}){try{let r;if(saved)r=await api('/api/bookings/status',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({...saved,action,...patch})});else r=await api('/api/client/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'booking_action',token:account.token,bookingId:booking.id,bookingAction:action,...patch})});booking=r.booking;events=r.events||[];renderTrack()}catch(e){alert(e.message)}}
function profilePage(){const orders=account?.bookings||[];shell(tx().profile,`<div class="panel darkp"><span class="kicker">CLIENT HUB · V2.1</span><h3>${esc(account?.profile?.displayName||account?.email||'Muuttobotti')}</h3><p class="small">${esc(account?.email||'Local booking access')}</p></div><div class="panel"><b>${esc(tx().orders)}</b>${orders.map(o=>`<div class="booking"><button data-order="${esc(o.id)}"><span class="bookingid">${esc(o.id)}</span><div class="bookingname">${esc(o.pickup)} → ${esc(o.destination)}</div><div class="meta">${esc(o.preferred_date)} · ${esc(o.preferred_time)} · ${esc(S[locale]?.[o.status]||o.status)}</div></button></div>`).join('')||'<p class="small">No account orders</p>'}</div><div class="panel"><b>Language</b>${langs()}</div><div class="panel"><b>Support</b><p class="small">045 787 67567 · WhatsApp · autochemixfin@gmail.com</p></div>`);bindLang();document.querySelectorAll('[data-order]').forEach(b=>b.onclick=async()=>{const r=await api('/api/client/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'me',token:account.token,bookingId:b.dataset.order})});booking=r.booking;events=r.events||[];saved=null;client('track')})}
async function loadAdmin(){const h={Authorization:`Bearer ${adminToken}`};const[o,a]=await Promise.all([api('/api/admin/operations',{headers:h}),api('/api/admin/availability',{headers:h})]);adminData={bookings:o.bookings||[],workers:o.workers||[],stats:o.stats||{},blocks:a.blocks||[],schedule:a.bookings||[]}}
function admin(){stop();root.innerHTML=`<section class="shell animate"><header class="header"><div class="headrow"><div class="brandrow"><div class="mark" style="width:34px;height:34px;border-radius:11px;font-size:15px">M</div><b>Operations v2.1</b></div><button id="adminOut" class="headbtn">Kirjaudu ulos</button></div><h2>Live Operations</h2><p>AUTO · 15 S · orders · crew · calendar</p></header><div class="content" id="ac"></div></section>`;document.getElementById('adminOut').onclick=()=>{stop();localStorage.removeItem('mbAdmin');adminToken='';login()};renderAdmin();timer=setInterval(async()=>{try{await loadAdmin();renderAdmin()}catch{}},15000)}
function renderAdmin(){const st=adminData.stats||{};document.getElementById('ac').innerHTML=`<div class="adminstats"><div class="stat"><b>${st.total||adminData.bookings.length}</b><small>ALL</small></div><div class="stat"><b>${st.new_count||0}</b><small>NEW</small></div><div class="stat"><b>${st.active_count||0}</b><small>ACTIVE</small></div><div class="stat"><b>${st.today_count||0}</b><small>TODAY</small></div></div><div class="panel"><b>Orders</b>${adminData.bookings.map(adminCard).join('')||'<p class="small">No orders</p>'}</div><div class="panel"><b>Calendar & availability</b><p class="small">Blocked slots are hidden from Smart Booking immediately.</p><div class="field"><label>Date</label><input id="bd" type="date" value="${new Date(Date.now()+86400000).toISOString().slice(0,10)}"></div><div class="seg"><button id="allDay" class="on">Full day</button><button id="partDay">Time range</button></div><div id="range" class="twocol hidden"><div class="field"><label>Start</label><input id="bs" type="time" value="09:00"></div><div class="field"><label>End</label><input id="be" type="time" value="12:00"></div></div><div class="field"><label>Label</label><input id="bl" placeholder="Reason / note"></div><button id="addBlock" class="primary">+ Block time</button>${adminData.blocks.slice(0,20).map(x=>`<div class="block"><div><b>${esc(x.block_date)}</b><div class="small">${Number(x.all_day)===1?'FULL DAY':`${esc(x.start_time)}–${esc(x.end_time)}`} ${esc(x.label||'')}</div></div><button data-del="${esc(x.id)}">Remove</button></div>`).join('')}</div>`;let ad=true;document.getElementById('allDay').onclick=()=>{ad=true;document.getElementById('allDay').classList.add('on');document.getElementById('partDay').classList.remove('on');document.getElementById('range').classList.add('hidden')};document.getElementById('partDay').onclick=()=>{ad=false;document.getElementById('partDay').classList.add('on');document.getElementById('allDay').classList.remove('on');document.getElementById('range').classList.remove('hidden')};document.getElementById('addBlock').onclick=async()=>{try{await api('/api/admin/availability',{method:'POST',headers:{Authorization:`Bearer ${adminToken}`,'Content-Type':'application/json'},body:JSON.stringify({date:document.getElementById('bd').value,allDay:ad,start:ad?'':document.getElementById('bs').value,end:ad?'':document.getElementById('be').value,label:document.getElementById('bl').value})});await loadAdmin();renderAdmin()}catch(e){alert(e.message)}};document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await api(`/api/admin/availability?id=${encodeURIComponent(b.dataset.del)}`,{method:'DELETE',headers:{Authorization:`Bearer ${adminToken}`}});await loadAdmin();renderAdmin()});bindAdminActions()}
function adminCard(b){return `<div class="admincard"><div class="between"><span class="bookingid">${esc(b.id)}</span><span class="status">${esc(S.fi[b.status]||b.status)}</span></div><div class="bookingname">${esc(b.customer_name)}</div><div class="meta">${esc(b.preferred_date)} · ${esc(b.preferred_time)} · ${esc(b.service)}</div><div class="route">${esc(b.pickup)} → ${esc(b.destination)}</div><div class="actions">${['confirmed','assigned','on_the_way','in_progress','completed'].map(s=>`<button data-status="${s}" data-id="${esc(b.id)}" class="${b.status===s?'on':''}">${esc(S.fi[s])}</button>`).join('')}</div><div class="twocol"><div class="field"><label>Offer €</label><input id="q-${esc(b.id)}" value="${Number(b.quoted_price||0)||''}"></div><div class="field"><label>Crew</label><select id="w-${esc(b.id)}"><option value="">—</option>${adminData.workers.filter(w=>w.active).map(w=>`<option value="${esc(w.worker_id)}" ${b.assigned_worker===w.name?'selected':''}>${esc(w.name)}</option>`).join('')}</select></div></div><button class="secondary" data-save="${esc(b.id)}">Save offer / crew</button></div>`}
function bindAdminActions(){document.querySelectorAll('[data-status]').forEach(x=>x.onclick=()=>adminPatch(x.dataset.id,'status',{status:x.dataset.status}));document.querySelectorAll('[data-save]').forEach(x=>x.onclick=async()=>{const id=x.dataset.save,amount=Number(document.getElementById(`q-${id}`).value),worker=document.getElementById(`w-${id}`).value;if(amount>0)await adminPatch(id,'quote',{amount,note:''},false);if(worker)await adminPatch(id,'assign',{worker_id:worker},false);await loadAdmin();renderAdmin()})}
async function adminPatch(id,action,patch={},rerender=true){try{await api('/api/admin/operations',{method:'PATCH',headers:{Authorization:`Bearer ${adminToken}`,'Content-Type':'application/json'},body:JSON.stringify({id,action,...patch})});if(rerender){await loadAdmin();renderAdmin()}}catch(e){alert(e.message)}}
function render(){if(role==='admin'&&adminToken){loadAdmin().then(admin).catch(login);return}if(account||saved||booking){client(view);return}login()}render();
</script></body></html>
