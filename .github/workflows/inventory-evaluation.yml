name: Inventory extraction evaluation
on:
  push:
    branches: ['feat/ai-inventory-evaluation-20260910']
    paths: ['.github/workflows/inventory-evaluation.yml']
  pull_request:
    paths:
      - 'lib/inventory/**'
      - 'evals/inventory/**'
      - 'scripts/eval-inventory.mjs'
      - 'tests/inventory.test.mjs'
      - 'mobile/src/screens/ClientCalculatorScreen.tsx'
      - '.github/workflows/inventory-evaluation.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Run 32 billable provider requests using repository secrets'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Contract tests (no API key)
        run: node --test tests/inventory.test.mjs
      - name: Frozen baseline
        run: node scripts/eval-inventory.mjs
      - name: Single provider diagnostic (no retries)
        if: github.event_name == 'push' && github.event.head_commit.message == 'Diagnose inventory API quota once 20260910-01' && github.run_attempt == 1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_INVENTORY_MODEL: ${{ vars.OPENAI_INVENTORY_MODEL }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          const r = await fetch('https://api.openai.com/v1/responses', {
            method: 'POST',
            headers: {Authorization: 'Bearer ' + process.env.OPENAI_API_KEY, 'Content-Type':'application/json'},
            signal: AbortSignal.timeout(15000),
            body: JSON.stringify({model:process.env.OPENAI_INVENTORY_MODEL,store:false,input:'Reply OK',max_output_tokens:16})
          });
          const data = await r.json();
          const allowed = ['insufficient_quota','rate_limit_exceeded','invalid_api_key','model_not_found','billing_hard_limit_reached'];
          const result = {status:r.status,code:allowed.includes(data?.error?.code)?data.error.code:(r.ok?'ok':'other_provider_error'),model:process.env.OPENAI_INVENTORY_MODEL};
          console.log(JSON.stringify(result));
          await fs.writeFile('evals/inventory/results/provider-diagnostic.json',JSON.stringify(result,null,2)+'\n');
          if(!r.ok) process.exitCode=1;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-evaluation
          path: evals/inventory/results/
