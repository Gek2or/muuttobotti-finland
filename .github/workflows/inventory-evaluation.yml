name: Inventory extraction evaluation
on:
  push:
    branches: ['feat/ai-inventory-evaluation-20260910']
    paths: ['.github/workflows/inventory-evaluation.yml']
  pull_request:
    paths:
      - 'lib/inventory/**'
      - 'evals/inventory/**'
      - 'scripts/eval-inventory.mjs'
      - 'tests/inventory.test.mjs'
      - 'mobile/src/screens/ClientCalculatorScreen.tsx'
      - '.github/workflows/inventory-evaluation.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Run 32 billable provider requests using repository secrets'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Contract tests (no API key)
        run: node --test tests/inventory.test.mjs
      - name: Frozen baseline
        run: node scripts/eval-inventory.mjs
      - name: Approved funded evaluation with one-request preflight
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run funded inventory evaluation 20260910-03' && github.run_attempt == 1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_INVENTORY_MODEL: ${{ vars.OPENAI_INVENTORY_MODEL }}
        run: |
          node --input-type=module <<'JS'
          import {extractInventory} from './lib/inventory/extract.mjs';
          const r = await extractInventory('2 sofas and 10 boxes. No piano.', {apiKey:process.env.OPENAI_API_KEY,model:process.env.OPENAI_INVENTORY_MODEL});
          console.log('PREFLIGHT_RESULT '+JSON.stringify({ok:r.ok,reason:r.reason??null,trace:r.trace}));
          if(!r.ok) process.exit(1);
          JS
          node scripts/eval-inventory.mjs --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-evaluation
          path: evals/inventory/results/
