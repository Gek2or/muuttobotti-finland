name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Verify native dependency alignment
        working-directory: mobile
        run: npm ls react react-dom react-native expo expo-modules-core react-native-reanimated react-native-worklets

      - name: Typecheck diagnostics
        working-directory: mobile
        continue-on-error: true
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Muuttobotti-v0.3-test.apk
          sha256sum Muuttobotti-v0.3-test.apk > Muuttobotti-v0.3-test.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muuttobotti-v0.3-test-apk
          path: |
            Muuttobotti-v0.3-test.apk
            Muuttobotti-v0.3-test.apk.sha256
          if-no-files-found: error
          retention-days: 14
