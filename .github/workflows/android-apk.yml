name: Build Android Standalone APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Verify native dependency alignment
        working-directory: mobile
        run: npm ls react react-dom react-native expo expo-modules-core react-native-reanimated react-native-worklets react-native-safe-area-context

      - name: Typecheck diagnostics
        working-directory: mobile
        continue-on-error: true
        run: npm run typecheck

      - name: Generate Android project
        working-directory: mobile
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: mobile/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify embedded JS bundle and prepare APK
        run: |
          test -f mobile/android/app/build/outputs/apk/release/app-release.apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk Muuttobotti-v1.1.0-standalone.apk
          sha256sum Muuttobotti-v1.1.0-standalone.apk > Muuttobotti-v1.1.0-standalone.apk.sha256
          ls -lh Muuttobotti-v1.1.0-standalone.apk

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Muuttobotti-v1.1.0-standalone-apk
          path: |
            Muuttobotti-v1.1.0-standalone.apk
            Muuttobotti-v1.1.0-standalone.apk.sha256
          if-no-files-found: error
          retention-days: 14
